vpremises-environment-deployment = { git = "https://github.com/vpremises/environment-deployment", rev = "218799219136ad7c65f7d0122722443aca37d4f6", version = "0.2.0" }
vpremises-incus-driver = { git = "https://github.com/vpremises/environment-deployment", rev = "218799219136ad7c65f7d0122722443aca37d4f6", version = "0.2.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
