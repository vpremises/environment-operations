[package]
name = "vpremises-environment-plan"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
repository = "https://github.com/vpremises/environment-operations"
description = "Operator CLI for validated environment plans and provider configuration rendering"

[dependencies]
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "=0.11.1"
hex = "=0.4.3"
zixcel-bounded-io = { git = "https://github.com/zixcel/zixcel-contracts", rev = "762d3d89226a1784ef4ef2f68a625084d1642e09", version = "=0.1.0" }

vpremises-environment-deployment = { git = "https://github.com/vpremises/environment-deployment", rev = "b37e1f9770680c9515c4f940e0b16a95b6e965a8", version = "=0.3.0" }
vpremises-incus-driver = { git = "https://github.com/vpremises/environment-deployment", rev = "b37e1f9770680c9515c4f940e0b16a95b6e965a8", version = "=0.3.0" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
