[package]
name = "vpremises-environment-plan"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
repository = "https://github.com/vpremises/environment-operations"
description = "Operator CLI for validated environment plans and provider configuration rendering"

[dependencies]
