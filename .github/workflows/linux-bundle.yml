name: Verify standalone Linux bundle
on:
  push:
    branches: [main]
    paths: ['apps/security-inspector/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/linux-bundle.yml']
  pull_request:
    paths: ['apps/security-inspector/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/linux-bundle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and advisory checker
        run: |
          rustup toolchain install 1.97 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup default 1.97
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          cargo +1.97 install cargo-audit --version 0.22.2 --locked --no-default-features --root "$RUNNER_TEMP/audit-tools"
          echo "CARGO_AUDIT_BIN=$RUNNER_TEMP/audit-tools/bin/cargo-audit" >> "$GITHUB_ENV"
      - name: Audit resolved workspace dependencies
        run: '"$CARGO_AUDIT_BIN" audit --deny warnings'
      - name: Build and verify the standalone bundle and synthetic reports
        working-directory: apps/security-inspector
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/package.sh "$GITHUB_WORKSPACE/dist"
      - name: Retain detector audit diagnostics even when packaging stops
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspector-detector-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-detector-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: artifact
        with:
          name: security-inspector-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  attest:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Verify the exact main bundle provenance before owner promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir verified-provenance
          for archive in dist/*.zip dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux-bundle.yml" \
              --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main --deny-self-hosted-runners --format json \
              > "verified-provenance/$(basename "$archive").json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inspector-verified-provenance-${{ github.sha }}
          path: verified-provenance/
          if-no-files-found: error
          retention-days: 14
