name: Verify standalone Windows artifact
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build helper and test synthetic runner credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.97 build --locked --release -p vpremises-windows-custody-helper --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CROWSI_WINDOWS_CUSTODY_PROVIDER_EXECUTABLE = (Resolve-Path target/x86_64-pc-windows-msvc/release/vpremises-windows-custody-helper.exe).Path
          $sdkRevision = python -c "import tomllib; d=tomllib.load(open('native/windows-custody-helper/Cargo.toml','rb'))['dependencies']['crowsi-windows-custody-provider']; assert d['git']=='https://github.com/crowsi-net/credential-custody.git'; print(d['rev'])"
          if ($LASTEXITCODE -ne 0 -or $sdkRevision -notmatch '^[a-f0-9]{40}$') { exit 1 }
          $sdkCheckout = Join-Path $env:RUNNER_TEMP 'reviewed-credential-sdk'
          git init -q $sdkCheckout
          git -C $sdkCheckout fetch -q --depth 1 https://github.com/crowsi-net/credential-custody.git $sdkRevision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $sdkCheckout checkout -q --detach FETCH_HEAD
          if ((git -C $sdkCheckout rev-parse HEAD) -ne $sdkRevision) { exit 1 }
          Push-Location $sdkCheckout
          try {
            cargo +1.97 test --locked -p crowsi-windows-custody-provider --test helper-identity
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo +1.97 test --locked -p crowsi-windows-custody-provider --test windows-dpapi-live -- --ignored
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $env:CROWSI_WINDOWS_CUSTODY_PROVIDER_EXECUTABLE,LICENSE,NOTICE dist
          & ./scripts/dependency-notices.ps1
          Compress-Archive -Path dist/* -DestinationPath windows-custody.zip
          python scripts/windows-release-manifest.py create --archive windows-custody.zip --binary dist/vpremises-windows-custody-helper.exe --source-sha $env:GITHUB_SHA --manifest windows-custody-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-release-manifest.py verify --archive windows-custody.zip --source-sha $env:GITHUB_SHA --manifest windows-custody-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: artifact
        with:
          name: windows-custody-${{ github.sha }}
          path: |
            windows-custody.zip
            windows-custody-manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
  attest:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'vpremises/environment-operations'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/windows-custody.zip
            dist/windows-custody-manifest.json
